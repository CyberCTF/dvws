apiVersion: v1
kind: Namespace
metadata:
  name: isoloom-dvws
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: db
  template:
    metadata:
      labels:
        isoloom.com/machine: db
        net.isoloom.com/lab: member
    spec:
      hostname: db
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      containers:
      - name: db
        image: isoloom/dvws-db
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3306
        readinessProbe:
          exec:
            command:
            - /.isoloom-probe/busybox
            - sh
            - -c
            - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3306
          periodSeconds: 5
          failureThreshold: 60
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: vol-data
          mountPath: /var/lib/mysql
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: vol-data
        persistentVolumeClaim:
          claimName: db-data
      - name: isoloom-probe
        emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
spec:
